name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # CI's documentation job saves this store on main, so this build only restores it.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          save-cache: false
          require-lockfile: true

      # RevIQ keeps the seller list at this address. The committed copy stays when the fetch fails.
      - name: Refresh ads.txt
        run: |
          if curl -fsSL --max-time 20 https://rev.iq/f1.swofty.net/ads.txt -o ads.txt.new && grep -q '^rev.iq,' ads.txt.new; then
            mv ads.txt.new docs/public/ads.txt
          fi

      - name: Build
        run: pnpm --filter @f1modmanager/docs docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
